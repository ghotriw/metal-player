name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Test & Package
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Install dependencies
        run: |
          brew install ffmpeg pkg-config swift-format

      - name: Ensure Metal Toolchain is installed
        run: |
          sudo xcodebuild -runFirstLaunch || true
          sudo xcodebuild -downloadComponent metalToolchain || true
          xcodebuild -showComponent metalToolchain || true
          xcrun metal --version || true

      - name: Verify direct shader compilation
        run: |
          xcrun metal -c Sources/MetalPlayerCore/Video/HDRToneMapping.metal -o /tmp/HDRToneMapping.air

      - name: Lint check (code style)
        run: ./scripts/format.sh lint

      - name: Typecheck and build targets
        run: ./scripts/format.sh typecheck

      - name: Run test suite
        run: swift test

      - name: Package MetalPlayer.app
        run: ./scripts/bundle_app.sh
