name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Test & Package
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ffmpeg pkg-config swift-format

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Lint check (code style)
        run: ./scripts/format.sh lint

      - name: Typecheck and build targets
        run: ./scripts/format.sh typecheck

      - name: Run test suite
        run: swift test

      - name: Package MetalPlayer.app
        run: ./scripts/bundle_app.sh
