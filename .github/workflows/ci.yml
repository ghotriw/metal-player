name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Test & Package
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ffmpeg pkg-config swift-format

      - name: Lint check (code style)
        run: ./scripts/format.sh lint

      - name: Typecheck and build targets
        run: ./scripts/format.sh typecheck

      - name: Run test suite
        run: swift test

      - name: Package MetalPlayer.app
        run: ./scripts/bundle_app.sh
